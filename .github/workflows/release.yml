name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.20
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python scripts/check.py
      - name: Verify tag matches package version
        run: test "v$(uv run --frozen python -c 'import breakerledger; print(breakerledger.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uv run --frozen python scripts/verify_package.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "BreakerLedger $GITHUB_REF_NAME"
