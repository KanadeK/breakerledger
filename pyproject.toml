[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "breakerledger"
dynamic = ["version"]
description = "Compile breaker test observations into an evidence-backed panel directory and retest queue"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "breaker-panel",
  "circuit-mapping",
  "electrical-documentation",
  "evidence",
  "offline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[dependency-groups]
dev = [
  "build==1.5.0",
  "mypy==2.3.1",
  "ruff==0.16.4",
]

[project.scripts]
breakerledger = "breakerledger.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/breakerledger"
Issues = "https://github.com/KanadeK/breakerledger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/breakerledger"]

[tool.hatch.version]
path = "src/breakerledger/__init__.py"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
