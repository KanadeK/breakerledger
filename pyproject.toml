[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "breakerledger"
dynamic = ["version"]
description = "Compile breaker test observations into an evidence-backed panel directory and retest queue"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "breaker-panel",
  "circuit-mapping",
  "electrical-documentation",
  "evidence",
  "offline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
breakerledger = "breakerledger.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/breakerledger"
Issues = "https://github.com/KanadeK/breakerledger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/breakerledger"]

[tool.hatch.version]
path = "src/breakerledger/__init__.py"
